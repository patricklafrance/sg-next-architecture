# The strategy is to run only on push, either for PR or the default branch (main). For both, only the affected storybooks are built and published to Chromatic.
# For PRs, the base SHA is computed as the merge-base with main, so only changes relative to main are considered.
# For pushes to main, the base SHA is the before SHA of the push event.
# This ensures that Chromatic only considers changes relative to main, avoiding ephemeral merge commits.
# For additional information, refer to: https://www.chromatic.com/docs/github-actions/#recommended-configuration-for-build-events.


# TODO: So it seems like I could have a mix of both "push" and "pull_request" events.... That could make things more simple? Or not...
# it seems safer though to ignore draft PR.... which is super important
# The important part would be set the 3 chromatic env variables... and the ref for the checkout.

name: Chromatic

# TODO:
# - skip draft PRs

# According to Chromatic documentation, the pipeline should only run on "push" events to avoid running on "ephemeral merge commits"
# and polluting the Git history.
on:
  push:
    branches-ignore: ['renovate/**']

env:
  CI: true

concurrency:
  group: chromatic-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TURBO_TELEMETRY_DISABLED: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
            # Required to calculate chromatic baseline.
            fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
            node-version: ">=24.0.0"
            check-latest: true
            cache: pnpm
            cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore Turborepo cache
        id: cache-turborepo-restore
        uses: actions/cache/restore@v5
        with:
          # Using SHA will usually provide cache hit on subsequent commits in a PR
          # but will not provide cache hits between PRs, meaning the first run of a PR
          # will usually only be cache misses.
          key: ${{ runner.os }}-turbo-chromatic-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-chromatic-
            ${{ runner.os }}-turbo-
          path: .turbo

      - name: Compute base SHA
        id: compute-base-sha
        shell: bash
        # Use the before SHA for pushes to main, otherwise compute the merge-base for PRs.
        run: |
            if [ "${{ github.ref }}" = "refs/heads/main" ]; then
                echo "VALUE=${{ github.event.before }}" >> "$GITHUB_OUTPUT"
            else
                # push to a feature branch: diff against merge-base with main
                echo "VALUE=$(git merge-base origin/main $GITHUB_SHA)" >> "$GITHUB_OUTPUT"
            fi

      - name: Get affected Storybooks
        id: affected
        working-directory: ${{ github.workspace }}
        run: pnpm tsx tooling/getAffectedStorybooks.ts
        env:
            BASE_SHA: ${{ steps.compute-base-sha.outputs.VALUE }}

      - name: Chromatic - Home
        uses: chromaui/action@latest
        with:
            projectToken: ${{ secrets.HOME_CHROMATIC_PROJECT_TOKEN }}
            workingDir: apps/home/storybook
            onlyChanged: true
            exitOnceUploaded: true
            autoAcceptChanges: 'main'
            # Must be 'false' not false.
            skip: ${{ steps.affected.outputs['@apps/home-storybook'] == 'false' }}
            debug: true

      - name: Chromatic - Packages
        uses: chromaui/action@latest
        with:
            projectToken: ${{ secrets.PACKAGES_CHROMATIC_PROJECT_TOKEN }}
            workingDir: packages/storybook
            onlyChanged: true
            exitOnceUploaded: true
            autoAcceptChanges: 'main'
            # Must be 'false' not false.
            skip: ${{ steps.affected.outputs['@apps/packages-storybook'] == 'false' }}
            debug: true

      - name: Save Turborepo cache
        id: cache-turborepo-save
        if: always() && steps.cache-turborepo-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          key: ${{ steps.cache-turborepo-restore.outputs.cache-primary-key }}
          path: .turbo

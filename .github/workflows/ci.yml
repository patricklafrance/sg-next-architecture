name: CI

# PNPM setup based on https://github.com/pnpm/action-setup#use-cache-to-reduce-installation-time

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  CI: true

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TURBO_TELEMETRY_DISABLED: '1'

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '>=24.0.0'
          check-latest: true
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore Turborepo cache
        id: cache-turborepo-restore
        uses: actions/cache/restore@v5
        with:
          key: ${{ runner.os }}-turbo-ci-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-ci-
            ${{ runner.os }}-turbo-
          path: .turbo

      - name: ESLint
        run: |
          if [ "${{ github.event_name }}" == "pull_request" ]; then
              pnpm turbo run eslint --filter=...[${{ github.event.pull_request.base.sha }}]
          else
              pnpm turbo run eslint
          fi

      - name: Stylelint
        run: |
          if [ "${{ github.event_name }}" == "pull_request" ]; then
              pnpm turbo run stylelint --filter=...[${{ github.event.pull_request.base.sha }}]
          else
              pnpm turbo run stylelint
          fi

      - name: Typecheck
        run: |
          if [ "${{ github.event_name }}" == "pull_request" ]; then
              pnpm turbo run typecheck --filter=...[${{ github.event.pull_request.base.sha }}]
          else
              pnpm turbo run typecheck
          fi

      - name: Syncpack
        run: pnpm turbo run syncpack

      - name: Build host
        run: pnpm build-host

      - name: Save Turborepo cache
        id: cache-turborepo-save
        if: always() && steps.cache-turborepo-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          key: ${{ steps.cache-turborepo-restore.outputs.cache-primary-key }}
          path: .turbo

